<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Route-focused AI model and provider guide."><title>{{ title or label }} — UseThisModel</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><aside class="rail"><a class="brand" href="/"><span class="brand-mark">U</span><span>UseThisModel</span></a><div class="nav-label">DECISION TOOLKIT</div><nav>{% for label,url in nav %}<a href="{{ url }}" {% if current_path == url or (url != '/' and current_path.startswith(url)) %}class="active"{% endif %}><span class="nav-dot"></span>{{ label }}</a>{% endfor %}</nav><div class="rail-bottom"><span class="live-dot"></span>Route data <span class="version">v0.3</span></div></aside><main><header><div class="crumb">{{ (title or label)|upper }}</div><button id="theme-toggle" class="theme-toggle">☼ <span>Appearance</span></button></header>{% block content %}{% endblock %}</main><script src="{{ url_for('static', filename='theme.js') }}"></script><script src="{{ url_for('static', filename='finder.js') }}"></script></body></html>
